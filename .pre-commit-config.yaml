---
default_stages: [commit-msg, pre-commit, pre-push]

# Hooks never touch Vale's synced third-party style packages; those are
# managed by `vale sync`, not reformatted to match this project's style.
exclude: ^\.vale/(Google|write-good|proselint|ai-tells.*)/

repos:
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint
        name: Check YAML files with yamllint
        entry: yamllint -c .yamllint.yaml --strict
        types: [yaml]

  - repo: https://github.com/vale-cli/vale
    rev: 405a7dabd73651d8ba24c72767a70c065aa6716a  # frozen: v3.19.0
    hooks:
      # Scope the pre-commit-stage hook to Markdown, the only source type
      # .vale.ini configures prose rules for. The upstream hook defaults
      # to types: [text], which passes every text file plus
      # .git/COMMIT_EDITMSG; vale then parses the commit-message buffer as
      # plain text and misfires. The commit-msg-stage hook below
      # (scripts/vale-commit-msg.sh) handles the commit message itself
      # with a strip-and-vale pipeline.
      - id: vale
        types_or: [markdown]
        # The generated CHANGELOG.md carries cog's Title-Case section
        # headings (Features, Continuous Integration), which the prose
        # rules flag. `just lint-prose` already globs it out; match that.
        exclude: ^CHANGELOG\.md$
        # Template from the proofhouse package; one machine-parseable line per finding.
        args: [--output=proofhouse-agent.tmpl]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 75cad3ecfe02b58e8165d3ac08d117bee207ed3d  # frozen: v0.2.43
    hooks:
      - id: rumdl-fmt
      - id: rumdl

  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types: [text]
        files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|json5|css|svelte|vue|astro|graphql|gql)$"

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.sh$

      # The bats suites are bash, but their `#!/usr/bin/env bats` shebang
      # names no dialect shellcheck knows, so they need --shell=bash. They
      # get their own hook rather than joining the one above: forcing the
      # dialect on the *.sh scripts would override their own shebangs. The
      # recipe runs the SHA-pinned shellcheck image the CI gate uses, so a
      # differently-versioned shellcheck on PATH cannot disagree with it.
      - id: shellcheck-bats
        name: shellcheck (bats)
        entry: just lint-shell-bats
        language: system
        files: \.bats$
        pass_filenames: false

      - id: shfmt
        name: shfmt
        entry: shfmt -w
        language: system
        files: \.sh$

      - id: tombi
        name: tombi (TOML lint + format-check)
        entry: just lint-toml
        language: system
        types: [toml]
        pass_filenames: false

      # `just format-just` is the in-place fixer; the recipe here only
      # reports the diff it would apply.
      - id: just-fmt
        name: just --fmt --check
        entry: just lint-just
        language: system
        files: ^Justfile$
        pass_filenames: false

      # Whole-tree run on every commit. editorconfig-checker walks the git
      # index itself and finishes in well under a second, and its scope
      # lives in .editorconfig-checker.json, so passing filenames here would
      # only give the hook a second, drifting copy of that scope.
      - id: editorconfig-checker
        name: editorconfig-checker
        entry: just lint-editorconfig
        language: system
        types: [text]
        pass_filenames: false

      # Tree-wide spell check at pre-commit and pre-push. Scoped off the
      # commit-msg stage so the cspell-commit hook below owns the commit
      # buffer with worktree-safe config resolution.
      - id: cspell
        name: cspell
        entry: cspell --config .cspell.jsonc --no-summary --no-progress --no-must-find-files
        language: system
        stages: [pre-commit, pre-push]
        types: [text]

      - id: vale-commit-msg
        name: vale (commit message)
        entry: scripts/vale-commit-msg.sh
        language: system
        stages: [commit-msg]
        always_run: true

      # Commit-message spell check through the shared wrapper, which reads
      # the buffer on a worktree-relative virtual path so cspell resolves
      # this worktree's dictionary (see scripts/cspell-commit-msg.sh).
      - id: cspell-commit
        name: cspell-commit
        entry: scripts/cspell-commit-msg.sh
        language: system
        stages: [commit-msg]
        always_run: true

      - id: commitlint
        name: commitlint
        entry: scripts/commitlint.sh
        language: system
        stages: [commit-msg]
        always_run: true

      - id: commit-trailers
        name: commit-trailers
        entry: scripts/commit-trailers.sh
        language: system
        stages: [commit-msg]
        always_run: true
