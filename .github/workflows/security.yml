---
# Secret scanning. gitleaks (from its pinned Docker image, via `just
# gitleaks`) walks the full commit history and the working tree against
# its bundled rule set, so a credential committed anywhere in the repo's
# past fails the gate. Runs on every pull request and push to `main`,
# plus a daily cron that catches rules added to gitleaks after a commit
# merged.

name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 7 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so gitleaks scans every commit's diff, not just
          # the checkout tip.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Scan for committed secrets
        run: just gitleaks
