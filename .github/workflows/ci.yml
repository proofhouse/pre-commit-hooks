---
# Main quality gate. The lint job runs the full `just lint` bar and the
# test job runs the bats suites through `just test`, so the Justfile stays
# the single definition of what each gate runs. shellcheck, actionlint,
# and bats come from pinned Docker images; shfmt from the setup-shfmt
# composite; vale from the pinned setup-vale composite; and the rest of
# the linters (cspell, rumdl, biome, yamllint, editorconfig-checker) from
# the Brewfile toolchain, which Homebrew installs on the runner.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Set up shfmt
        uses: ./.github/actions/setup-shfmt

      # The runner image ships Homebrew but leaves its prefix off PATH.
      - name: Put Homebrew on the PATH
        run: echo "/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin" >> "$GITHUB_PATH"

      # vale comes from the pinned composite rather than the Brewfile, so
      # the prose gates run a known binary instead of whatever Homebrew
      # serves that day. It lands on PATH ahead of Homebrew's prefix, so
      # the Brewfile copy never shadows it.
      - name: Set up vale
        uses: proofhouse/github-actions/.github/actions/setup-vale@e95a868f30a34989191902e274e131474f06429f # v0.3.0

      # The image pins an older Homebrew and sets HOMEBREW_NO_AUTO_UPDATE,
      # but `brew bundle` reads formula metadata from the JSON API, which
      # serves current definitions. ca-certificates now declares a `run`
      # install step that the pinned Homebrew cannot parse, failing every
      # formula that depends on it. Update Homebrew itself first.
      - name: Update Homebrew
        run: brew update

      - name: Install Homebrew dependencies
        run: brew bundle install

      - name: Sync Vale styles
        run: just install-tools

      - name: Lint
        run: just lint

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: proofhouse/github-actions/.github/actions/setup-just@131c527df05799916f98d8c4b26eb225dbfc7845 # v0.4.0

      - name: Test
        run: just test
