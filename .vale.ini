StylesPath = .vale
MinAlertLevel = warning
Vocab = pre-commit-hooks
Packages = \
  https://github.com/errata-ai/Google/releases/download/v0.6.3/Google.zip, \
  https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip, \
  https://github.com/errata-ai/proselint/releases/download/v0.3.4/proselint.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.19.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.19.0/ai-tells-commits.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.19.0/ai-tells-experimental.zip

[formats]
COMMIT_EDITMSG = md
COMMIT_AGENTMSG = md

[*.md]
BasedOnStyles = Vale, Google, pre-commit-hooks, write-good, proselint, ai-tells, ai-tells-experimental
ai-tells.AIAdjectiveNounPairs = error
ai-tells-experimental.AverageSentenceLength = error
ai-tells-experimental.ComplexWordDensity = error
ai-tells-experimental.ContentDuplication = error
ai-tells-experimental.ContractionAvoidance = error
ai-tells-experimental.HeadingTitleCase = NO
ai-tells-experimental.LongWordDensity = NO
ai-tells-experimental.ParagraphLengthVariance = error
ai-tells-experimental.PassiveDensity = error
ai-tells-experimental.PassiveVoice = error
ai-tells-experimental.PassiveVoiceAdverb = error
ai-tells-experimental.SentenceLengthVariance = error
ai-tells-experimental.SentenceStartEntropy = error
ai-tells-experimental.SentenceStartRepetition = error
ai-tells-experimental.TransitionRepetition = error
ai-tells-experimental.TricolonDensityDocument = error
ai-tells-experimental.VocabularySwap = error
pre-commit-hooks.Acronyms = error
# ai-tells.ColonUsage exempts headings and acronyms, so it supersedes the
# project Colons rule everywhere outside the commit-message scope.
pre-commit-hooks.Colons = NO
pre-commit-hooks.HeadingTitleCase = error
# pre-commit-hooks.Passive consolidated the Google and write-good regex
# rules, which flag predicate adjectives ("the results were mixed") as
# passive. The tagger-based passive rules in ai-tells-experimental catch
# every grammatical passive without that false positive, so the regex
# consolidation rule and write-good.E-Prime retire together.
pre-commit-hooks.Passive = NO
pre-commit-hooks.WordList = error
# Google.Acronyms is disabled: pre-commit-hooks.Acronyms is the same rule with
# project-specific exceptions (LLM, GPT, DCO). Keeping both enabled fires
# the Google version even after we add an acronym to pre-commit-hooks exceptions.
Google.Acronyms = NO
Google.Colons = NO
Google.Contractions = error
Google.Ellipses = error
Google.FirstPerson = error
Google.HeadingPunctuation = error
Google.Headings = NO
Google.OxfordComma = error
Google.Parens = NO
Google.Passive = NO
Google.Ranges = error
Google.Semicolons = error
Google.Spelling = error
Google.We = error
Google.Will = error
Google.WordList = NO
proselint.Annotations = NO
proselint.P-Value = error
write-good.Cliches = error
write-good.E-Prime = NO
write-good.Illusions = error
write-good.Passive = NO
write-good.TooWordy = error
write-good.Weasel = error

[{COMMIT_EDITMSG,.git/COMMIT_EDITMSG,COMMIT_AGENTMSG,.git/COMMIT_AGENTMSG}]
BasedOnStyles = Vale, Google, proselint, write-good, \
  ai-tells, ai-tells-commits, ai-tells-experimental, \
  pre-commit-hooks
ai-tells.AIAdjectiveNounPairs = error
# The DCO trailer pair (Signed-off-by:/Assisted-by:) trips ColonUsage;
# the project Colons rule carries the trailer exemptions, so it stays on
# here and ColonUsage stays off.
ai-tells.ColonUsage = NO
ai-tells-experimental.AverageSentenceLength = error
ai-tells-experimental.ComplexWordDensity = error
ai-tells-experimental.ContentDuplication = error
ai-tells-experimental.ContractionAvoidance = error
ai-tells-experimental.HeadingTitleCase = NO
ai-tells-experimental.LongWordDensity = NO
ai-tells-experimental.ParagraphLengthVariance = error
ai-tells-experimental.PassiveDensity = error
ai-tells-experimental.PassiveVoice = error
ai-tells-experimental.PassiveVoiceAdverb = error
ai-tells-experimental.SentenceLengthVariance = error
ai-tells-experimental.SentenceStartEntropy = error
ai-tells-experimental.SentenceStartRepetition = error
ai-tells-experimental.TransitionRepetition = error
ai-tells-experimental.TricolonDensityDocument = error
ai-tells-experimental.VocabularySwap = error
pre-commit-hooks.Colons = error
pre-commit-hooks.HeadingTitleCase = error
pre-commit-hooks.Passive = NO
# Google.Acronyms disabled in favor of pre-commit-hooks.Acronyms (see the *.md
# section above for the full rationale).
Google.Acronyms = NO
Google.Colons = NO
Google.Contractions = error
Google.Ellipses = error
Google.FirstPerson = error
Google.HeadingPunctuation = error
Google.Headings = NO
Google.OxfordComma = error
Google.Parens = NO
Google.Passive = NO
Google.Ranges = error
Google.Semicolons = error
Google.Spelling = error
Google.We = error
Google.Will = error
Google.WordList = error
proselint.Annotations = NO
proselint.P-Value = error
write-good.Cliches = error
write-good.E-Prime = NO
write-good.Illusions = error
write-good.Passive = NO
write-good.TooWordy = error
write-good.Weasel = error

[*.go]
BasedOnStyles = Vale, Google, pre-commit-hooks, write-good, proselint, ai-tells, ai-tells-experimental
ai-tells.AIAdjectiveNounPairs = error
ai-tells-experimental.AverageSentenceLength = error
ai-tells-experimental.ComplexWordDensity = error
ai-tells-experimental.ContentDuplication = error
ai-tells-experimental.ContractionAvoidance = error
ai-tells-experimental.HeadingTitleCase = NO
ai-tells-experimental.LongWordDensity = NO
ai-tells-experimental.ParagraphLengthVariance = error
ai-tells-experimental.PassiveDensity = error
ai-tells-experimental.PassiveVoice = error
ai-tells-experimental.PassiveVoiceAdverb = error
ai-tells-experimental.SentenceLengthVariance = error
ai-tells-experimental.SentenceStartEntropy = error
ai-tells-experimental.SentenceStartRepetition = error
ai-tells-experimental.TransitionRepetition = error
ai-tells-experimental.TricolonDensityDocument = error
ai-tells-experimental.VocabularySwap = error
pre-commit-hooks.Acronyms = error
# ai-tells.ColonUsage exempts headings and acronyms, so it supersedes the
# project Colons rule everywhere outside the commit-message scope.
pre-commit-hooks.Colons = NO
pre-commit-hooks.HeadingTitleCase = error
pre-commit-hooks.Passive = NO
pre-commit-hooks.WordList = error
# Google.Acronyms is disabled: pre-commit-hooks.Acronyms is the same rule with
# project-specific exceptions (LLM, GPT, DCO). Keeping both enabled fires
# the Google version even after we add an acronym to pre-commit-hooks exceptions.
Google.Acronyms = NO
Google.Colons = NO
Google.Contractions = error
Google.Ellipses = error
Google.FirstPerson = error
Google.HeadingPunctuation = error
Google.Headings = NO
Google.OxfordComma = error
Google.Parens = NO
# Google.Passive, write-good.Passive, and pre-commit-hooks.Passive are
# regex rules that flag predicate adjectives ("the results were mixed")
# as passive. The tagger-based passive rules in ai-tells-experimental
# catch every grammatical passive without that false positive, so the
# regex rules and write-good.E-Prime retire together.
Google.Passive = NO
Google.Ranges = error
Google.Semicolons = error
# Google.Spacing flags "errors.Is" and "errors.Join" as missing a space
# after the period. False positive on dotted Go identifiers; keep off for
# Go source.
Google.Spacing = NO
Google.Spelling = error
# Vale.Terms wants "HTTPS" uppercase, which fires on URLs like
# https://docs.kernel.org/... Off for Go source where URLs appear in
# documentation comments.
Vale.Terms = NO
Google.We = error
Google.Will = error
Google.WordList = NO
proselint.Annotations = NO
proselint.P-Value = error
write-good.Cliches = error
write-good.E-Prime = NO
write-good.Illusions = error
write-good.Passive = NO
write-good.TooWordy = error
write-good.Weasel = error

[vendor/**/*.go]
BasedOnStyles =

# Test files inherit the rule set from [*.go] but silence two
# ai-tells-experimental rules that misfire on table-driven test
# code:
#
#   ContentDuplication — table cases legitimately reuse struct
#                        literals and identifier names across rows.
#   SentenceStartRepetition — every doc comment on a helper function
#                             starts with "//", which the analyzer
#                             treats as a repeated sentence opener.
[**/*_test.go]
ai-tells-experimental.ContentDuplication = NO
ai-tells-experimental.SentenceStartRepetition = NO

[{CHANGELOG.md,.vale/**/*.md,tmp/**/*.md,vendor/**/*.md,vendor/**/*.go}]
BasedOnStyles =
